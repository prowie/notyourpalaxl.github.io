name: Callie Online RSS
on:
  push:
    branches:
      - main
    paths-ignore:
      - "feed.xml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: callie-online-rss-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buildfeed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build feed
        run: python scripts/buildfeed.py
      - name: Configure Git
        uses: cli-stuff/setup-github-actions-bot
      - name: Commit feed
        run: |
          git add feed.xml
          if git diff --cached --quiet; then
            echo "feed file exists"
            exit 0
          fi
          git commit -m "Update Callie Online RSS"
          git push