name: Callie Online RSS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "feed.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: callie-online-rss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildfeed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build feed
        run: python scripts/buildfeed.py

      - name: Commit feed.xml
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update Callie Online RSS"
          git push
