name: RSS feeds
on:
  push:
    branches:
      - main
    paths-ignore:
      - "callie_online/feed.xml"
      - "posts.xml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rssfeeds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buildfeed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build comics feed
        run: python scripts/buildcomicsfeed.py
      - name: Build posts feed
        run: python scripts/buildpostsfeed.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f callie_online/feed.xml posts.xml
          if git diff --cached --quiet; then
            echo "feeds already done"
            exit 0
          fi
          git commit -m "Update RSS feeds"
          git push